<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forkify</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,300;0,400;0,500;1,200;1,300;1,400&family=Roboto:ital,wght@0,300;0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />

    <link rel="shortcut icon" href="img/fav.png" />
  </head>
  <body class="container container--back">
    <figure class="image__figure image__figure--1">
      <img
        src="img/img-6.jpg"
        alt="img-1"
        class="image__figure-img image__figure-img--1"
      />
    </figure>

    <figure class="image__figure image__figure--2">
      <img
        src="img/img-2.jpg"
        alt="img-2"
        class="image__figure-img image__figure-img--2"
      />
    </figure>

    <figure class="image__figure image__figure--3">
      <img
        src="img/test-2.jpg"
        alt="img-4"
        class="image__figure-img image__figure-img--3"
      />
    </figure>

    <figure class="image__figure image__figure--4">
      <img
        src="img/test-3.jpg"
        alt="img-3"
        class="image__figure-img image__figure-img--4"
      />
    </figure>

    <main class="main">
      <nav class="side-nav">
        <ul class="side-nav__list">
          <li class="side-nav__item">
            <div class="side-nav__icon-box">
              <svg class="side-nav__icon">
                <use xlink:href="img/sprite.svg#icon-unread"></use>
              </svg>
            </div>
          </li>

          <li class="side-nav__item">
            <div class="side-nav__icon-box">
              <svg class="side-nav__icon">
                <use xlink:href="img/sprite.svg#icon-heart-outlined"></use>
              </svg>
            </div>
          </li>

          <li class="side-nav__item side-nav__item--active">
            <div class="side-nav__icon-box">
              <svg class="side-nav__icon">
                <use xlink:href="img/sprite.svg#icon-home"></use>
              </svg>
            </div>
          </li>

          <li class="side-nav__item">
            <div class="side-nav__icon-box">
              <svg class="side-nav__icon">
                <use xlink:href="img/sprite.svg#icon-map"></use>
              </svg>
            </div>
          </li>

          <li class="side-nav__item">
            <div class="side-nav__icon-box">
              <svg class="side-nav__icon">
                <use xlink:href="img/sprite.svg#icon-credit-card"></use>
              </svg>
            </div>
          </li>
        </ul>
      </nav>

      <secton class="overview">
        <form class="search">
          <input
            type="search"
            class="search__input"
            placeholder="What would you like to eat?"
          />

          <svg class="search__icon">
            <use xlink:href="img/sprite.svg#icon-search"></use>
          </svg>

          <div class="search__trends"></div>
        </form>

        <div class="img-view">
          <div class="text">
            <span>40% off</span>
            <span>4 days left at this price!</span>
          </div>
        </div>

        <div class="img-view__dec">
          <span class="img-view__dec-span img-view__dec-span--1"></span>
          <span class="img-view__dec-span img-view__dec-span--2"></span>
          <span class="img-view__dec-span img-view__dec-span--3"></span>
          <span class="img-view__dec-span img-view__dec-span--4"></span>
        </div>
      </secton>
    </main>

    <script src="js/index.js"></script>
  </body>
</html>
