<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forkify</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,300;0,400;0,500;1,200;1,300;1,400&family=Roboto:ital,wght@0,300;0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />

    <link rel="shortcut icon" href="img/fav.png" />
  </head>
  <body class="container">
    <div class="circ-nav">
      <button class="circ-nav__button">
        <span class="circ-nav__span"></span>
      </button>

      <div class="circ-nav__spin">
        <a href="#" class="circ-nav__spin-link circ-nav__spin-link--1"
          >Sign in</a
        >
        <a href="#" class="circ-nav__spin-link circ-nav__spin-link--2">
          <svg class="circ-nav__spin-icon">
            <use xlink:href="img/sprite.svg#icon-search"></use>
          </svg>
        </a>
        <a href="#" class="circ-nav__spin-link circ-nav__spin-link--3"
          >Sign up</a
        >
      </div>
    </div>

    <header class="header">
      <nav class="header__nav">
        <ul class="header__nav-list">
          <div class="header__logo-box">
            <img src="img/logo.png" alt="logo" class="header__logo" />
          </div>

          <li class="header__nav-item">
            <a href="#" class="header__nav-link">Menu</a>
          </li>
          <li class="header__nav-item">
            <a href="#" class="header__nav-link">Locations</a>
          </li>
          <li class="header__nav-item">
            <a href="#" class="header__nav-link">About</a>
          </li>
          <li class="header__nav-item">
            <a href="#" class="header__nav-link">Blog</a>
          </li>

          <div class="header__nav-btn">
            <a href="#" class="btn btn--orange">Order Online</a>
          </div>
        </ul>
      </nav>

      <h1 class="h1">
        <span class="h1__span h1__span--1">Forkify of Ramen</span>
        <span class="h1__span h1__span--2">Tuesday <span>-</span> Sunday</span>
        <span class="h1__span h1__span--3">11Am <span>-</span> midnight</span>
      </h1>
    </header>

    <script src="js/index.js"></script>
  </body>
</html>
